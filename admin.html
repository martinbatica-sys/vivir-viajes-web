<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel de consultas · Vivir Viajes</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,600;0,700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16284C;--navy-2:#1E3566;--navy-deep:#0F1D38;
    --gold:#E9A23C;--gold-dark:#C9852A;
    --paper:#F5F7FB;--panel:#E9EFFA;--ink:#16284C;--ink-soft:#5A6A86;
    --line:rgba(22,40,76,.12);
    --display:"Poppins",sans-serif;--body:"Mulish",-apple-system,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.5;min-height:100vh}
  a{color:inherit}

  /* Login gate */
  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
  .gate-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:2.2rem 2rem;max-width:360px;width:100%;box-shadow:0 20px 45px -20px rgba(15,29,56,.3)}
  .gate-box h1{font-family:var(--display);font-size:1.25rem;color:var(--navy);margin-bottom:.4rem}
  .gate-box p{color:var(--ink-soft);font-size:.9rem;margin-bottom:1.4rem}
  .gate-box input{width:100%;font-family:var(--body);font-size:1rem;border:1.5px solid var(--line);border-radius:10px;padding:.7rem .8rem;margin-bottom:1rem}
  .gate-box input:focus{outline:none;border-color:var(--gold)}
  .gate-box button{width:100%;font-family:var(--body);font-weight:700;font-size:.95rem;background:var(--gold);color:var(--navy);border:none;border-radius:10px;padding:.8rem;cursor:pointer}
  .gate-box button:hover{background:var(--gold-dark)}
  .gate-error{color:#B5462E;font-size:.85rem;margin-top:.7rem;min-height:1.1em}

  /* App */
  #app{display:none}
  header{background:var(--navy);color:#fff;padding:1.1rem 1.4rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.8rem}
  header h1{font-family:var(--display);font-size:1.15rem;font-weight:600}
  header .meta{font-size:.82rem;color:rgba(255,255,255,.7)}
  .toolbar{display:flex;gap:.6rem;align-items:center;padding:1rem 1.4rem;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line)}
  .toolbar select,.toolbar input{font-family:var(--body);font-size:.88rem;border:1.5px solid var(--line);border-radius:8px;padding:.5rem .6rem}
  .toolbar button{font-family:var(--body);font-weight:700;font-size:.85rem;background:var(--panel);color:var(--navy);border:1.5px solid var(--line);border-radius:8px;padding:.5rem .8rem;cursor:pointer}
  .toolbar button:hover{border-color:var(--navy)}
  .stats{display:flex;gap:1.2rem;padding:0 1.4rem;margin-top:.9rem;flex-wrap:wrap}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.6rem 1rem;font-size:.82rem;color:var(--ink-soft)}
  .stat b{display:block;font-family:var(--display);font-size:1.15rem;color:var(--navy)}

  .table-wrap{padding:1.2rem 1.4rem 2.5rem;overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 230px)}
  table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:.85rem;min-width:1100px}
  th{text-align:left;background:var(--panel);color:var(--navy);font-weight:700;padding:.6rem .7rem;white-space:normal;position:sticky;top:0;vertical-align:top}
  .col-resizer{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;user-select:none;touch-action:none;z-index:2}
  .col-resizer:hover,.col-resizer.resizing{background:rgba(22,40,76,.18)}
  thead tr th:first-child{border-top-left-radius:12px}
  thead tr th:last-child{border-top-right-radius:12px}
  tbody tr:last-child td:first-child{border-bottom-left-radius:12px}
  tbody tr:last-child td:last-child{border-bottom-right-radius:12px}
  th input[type=text],th input[type=date],th select{display:block;margin-top:.35rem;width:100%;min-width:90px;font-family:var(--body);font-weight:400;font-size:.78rem;border:1.5px solid var(--line);border-radius:6px;padding:.3rem .4rem;box-sizing:border-box;background:#fff;color:var(--ink);white-space:normal}
  th .date-pair{display:flex;gap:.25rem;margin-top:.35rem}
  th .date-pair input{min-width:0;margin-top:0}
  td{padding:.55rem .7rem;border-top:1px solid var(--line);vertical-align:top}
  tr:hover td{background:#FAFBFE}
  .muted{color:var(--ink-soft)}
  .badge{display:inline-block;font-size:.72rem;font-weight:700;padding:.2rem .5rem;border-radius:6px;text-transform:uppercase;letter-spacing:.02em}
  .badge.mercadopago{background:#E6F4EC;color:#2E7D4F}
  .badge.whatsapp{background:#E7F1FB;color:#1E6FA3}
  .badge.receptivo{background:#FBEEDD;color:#C9852A}
  .badge.elcruce{background:#EFEAFB;color:#6B4FC9}
  select.status{font-family:var(--body);font-weight:700;font-size:.78rem;border-radius:6px;border:1.5px solid var(--line);padding:.3rem .4rem;cursor:pointer}
  select.status.nuevo{background:#F0F0F5;color:#4A4A66}
  select.status.contactado{background:#E7F1FB;color:#1E6FA3}
  select.status.cotizado{background:#FBEEDD;color:var(--gold-dark)}
  select.status.recontactar{background:#F0E6FB;color:#7A4FBF}
  select.status.pendiente_pago{background:#E1F3F3;color:#1E7A7A}
  select.status.ganado{background:#E6F4EC;color:#2E7D4F}
  select.status.perdido{background:#FDE9E7;color:#B5462E}
  .badge.status{cursor:default}
  .badge.status.nuevo{background:#F0F0F5;color:#4A4A66}
  .badge.status.contactado{background:#E7F1FB;color:#1E6FA3}
  .badge.status.cotizado{background:#FBEEDD;color:var(--gold-dark)}
  .badge.status.recontactar{background:#F0E6FB;color:#7A4FBF}
  .badge.status.pendiente_pago{background:#E1F3F3;color:#1E7A7A}
  .badge.status.ganado{background:#E6F4EC;color:#2E7D4F}
  .badge.status.perdido{background:#FDE9E7;color:#B5462E}
  .badge.abandonado{background:#FFF1DE;color:#B5622E}
  select.carga{font-family:var(--body);font-weight:700;font-size:.78rem;border-radius:6px;border:1.5px solid var(--line);padding:.3rem .4rem;cursor:pointer}
  select.carga.cargado{background:#E6F4EC;color:#2E7D4F}
  select.carga.pendiente{background:#FDE9E7;color:#B5462E}
  .badge.carga{cursor:default}
  .badge.carga.cargado{background:#E6F4EC;color:#2E7D4F}
  .badge.carga.pendiente{background:#FDE9E7;color:#B5462E}
  .badge.carga.noconfirmado{background:#FFF4CC;color:#8A6D1E}
  .abandonado-hint{display:block;font-size:.7rem;color:#B5622E;font-weight:700;margin-top:.3rem}
  .role-badge{font-size:.72rem;font-weight:700;padding:.2rem .55rem;border-radius:6px;background:rgba(255,255,255,.15);letter-spacing:.02em}
  .notes-input{width:160px;font-family:var(--body);font-size:.8rem;border:1.5px solid var(--line);border-radius:6px;padding:.35rem .5rem}
  .field-input{display:block;width:100%;max-width:170px;font-family:var(--body);font-size:.8rem;border:1.5px solid var(--line);border-radius:6px;padding:.35rem .5rem;box-sizing:border-box;background:#fff;color:var(--ink)}
  .field-input+.field-input{margin-top:.3rem}
  select.field-input{cursor:pointer}
  .save-hint{font-size:.7rem;color:var(--ink-soft);margin-left:.3rem}
  .delete-btn{border:1.5px solid #E3B0B0;background:#FFF5F5;color:#B5302E;border-radius:6px;padding:.35rem .6rem;font-size:.95rem;cursor:pointer;line-height:1}
  .delete-btn:hover{background:#FCE3E3}
  .delete-btn:disabled{opacity:.5;cursor:default}
  .empty{padding:2.5rem;text-align:center;color:var(--ink-soft)}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <h1>Panel de consultas</h1>
    <p>Acceso interno · Vivir Viajes</p>
    <input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password">
    <button type="button" id="pw-btn">Entrar</button>
    <div class="gate-error" id="pw-error"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1>📋 Panel de consultas y reservas</h1>
    <div style="display:flex;align-items:center;gap:.8rem">
      <span class="role-badge" id="role-badge" hidden>Solo lectura</span>
      <div class="meta" id="last-update"></div>
    </div>
  </header>

  <div class="toolbar">
    <button type="button" id="add-lead-btn">+ Agregar</button>
    <button type="button" id="f-clear-all">✕ Limpiar filtros</button>
    <button type="button" id="refresh-btn">↻ Actualizar</button>
    <button type="button" id="export-btn">⬇ Descargar planilla</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="table-wrap">
    <table id="table" hidden>
      <thead>
        <tr>
          <th data-col="fecha">
            Fecha
            <div class="date-pair">
              <input type="date" id="cf-from" title="Desde">
              <input type="date" id="cf-to" title="Hasta">
            </div>
            <span class="col-resizer"></span>
          </th>
          <th data-col="canal">
            Canal
            <select id="cf-channel">
              <option value="">Todos</option>
              <option value="mercadopago">Pago (MP)</option>
              <option value="whatsapp">Consulta (WA)</option>
              <option value="receptivo">Agencias</option>
              <option value="elcruce">El Cruce</option>
            </select>
            <span class="col-resizer"></span>
          </th>
          <th data-col="excursion">Excursión<input type="text" id="cf-excursion" placeholder="Filtrar..."><span class="col-resizer"></span></th>
          <th data-col="fechapaseo">Fecha paseo<input type="text" id="cf-fechapaseo" placeholder="Filtrar..."><span class="col-resizer"></span></th>
          <th data-col="cliente">Cliente<input type="text" id="cf-cliente" placeholder="Filtrar..."><span class="col-resizer"></span></th>
          <th data-col="hotel">Hotel<input type="text" id="cf-hotel" placeholder="Filtrar..."><span class="col-resizer"></span></th>
          <th data-col="pax">Pax<input type="text" id="cf-pax" placeholder="Filtrar..."><span class="col-resizer"></span></th>
          <th data-col="origen">Origen<input type="text" id="cf-origen" placeholder="Filtrar..."><span class="col-resizer"></span></th>
          <th data-col="total">Total<input type="text" id="cf-total" placeholder="Filtrar..."><span class="col-resizer"></span></th>
          <th data-col="estado">
            Estado
            <select id="cf-status">
              <option value="">Todos</option>
              <option value="nuevo">Nuevo</option>
              <option value="abandonado">Carrito abandonado</option>
              <option value="contactado">Contactado</option>
              <option value="cotizado">Cotizado</option>
              <option value="recontactar">Recontactar</option>
              <option value="pendiente_pago">Pendiente de pago</option>
              <option value="ganado">Ganado</option>
              <option value="perdido">Perdido</option>
            </select>
            <span class="col-resizer"></span>
          </th>
          <th data-col="carga">
            Carga sistema
            <select id="cf-carga">
              <option value="">Todos</option>
              <option value="cargado">Cargado en el sistema</option>
              <option value="pendiente">Pendiente de carga</option>
              <option value="noconfirmado">No confirmado</option>
            </select>
            <span class="col-resizer"></span>
          </th>
          <th data-col="notas">Notas<input type="text" id="cf-notas" placeholder="Filtrar..."><span class="col-resizer"></span></th>
          <th data-col="acciones">Acciones<span class="col-resizer"></span></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No hay consultas para mostrar.</div>
  </div>
</div>

<script>
  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const pwInput = document.getElementById('pw');
  const pwBtn = document.getElementById('pw-btn');
  const pwError = document.getElementById('pw-error');

  let ADMIN_KEY = '';
  try { ADMIN_KEY = sessionStorage.getItem('vv-admin-key') || ''; } catch (e) {}
  let ROLE = 'admin';
  try { ROLE = sessionStorage.getItem('vv-admin-role') || 'admin'; } catch (e) {}

  let allLeads = [];
  let filteredLeads = [];

  // Anchos de columna: el usuario los ajusta arrastrando el borde del
  // header, y quedan guardados por navegador (no son datos del lead).
  let colWidths = {};
  try { colWidths = JSON.parse(localStorage.getItem('vv-admin-colwidths') || '{}'); } catch (e) {}
  let colsInitialized = false;

  function saveColWidths() {
    try { localStorage.setItem('vv-admin-colwidths', JSON.stringify(colWidths)); } catch (e) {}
  }

  function initColWidths() {
    const ths = document.querySelectorAll('thead th[data-col]');
    ths.forEach(th => {
      const key = th.dataset.col;
      const w = colWidths[key] || th.getBoundingClientRect().width;
      th.style.width = Math.round(w) + 'px';
    });
    document.getElementById('table').style.tableLayout = 'fixed';
  }

  function initColResize() {
    document.querySelectorAll('thead th[data-col]').forEach(th => {
      const handle = th.querySelector('.col-resizer');
      if (!handle) return;
      handle.addEventListener('mousedown', e => {
        e.preventDefault();
        const startX = e.clientX;
        const startWidth = th.getBoundingClientRect().width;
        handle.classList.add('resizing');
        const onMove = e2 => {
          th.style.width = Math.max(70, startWidth + (e2.clientX - startX)) + 'px';
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          handle.classList.remove('resizing');
          colWidths[th.dataset.col] = Math.round(th.getBoundingClientRect().width);
          saveColWidths();
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });
  }

  function fmtDate(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  }

  function fmtMoney(n) {
    if (n == null || n === '') return '-';
    return '$' + Number(n).toLocaleString('es-AR');
  }

  function esc(v) {
    return String(v == null ? '' : v).replace(/"/g, '&quot;');
  }

  // Los leads de Receptivo se identifican por excursion, no por channel: la
  // columna channel en Supabase solo acepta 'whatsapp' / 'mercadopago', asi
  // que estos leads viajan como channel:'whatsapp' con esta excursion fija.
  function isReceptivo(lead) {
    return lead.excursion === 'Receptivo & Agencias';
  }

  // Los leads del traslado El Cruce (temporal, dic 2026) se identifican por
  // excursion_id, para poder filtrarlos aparte de las excursiones normales.
  function isElCruce(lead) {
    return lead.excursion_id === 'elcruce';
  }

  // Un lead de Mercado Pago que sigue en "nuevo" es alguien que llegó hasta
  // la pantalla de pago pero nunca la completó (create-preference.js crea
  // el lead ANTES de redirigir a Mercado Pago; el webhook lo pasa a "ganado"
  // solo si el pago se aprueba — si no, queda así, sin que nadie lo cambie).
  function isAbandonedCheckout(lead) {
    return lead.channel === 'mercadopago' && lead.status === 'nuevo';
  }

  // Los leads que vienen del sitio ya traen su Canal determinado por el
  // flujo que los creo (log-lead.js / create-preference.js). Solo los que
  // se cargan a mano desde "+ Agregar" (admin-create-lead.js, marcados con
  // external_reference "MANUAL-...") pueden editar ese campo.
  function isManualLead(lead) {
    return typeof lead.external_reference === 'string' && lead.external_reference.startsWith('MANUAL-');
  }
  function channelInfo(lead) {
    if (isReceptivo(lead)) return { cls: 'receptivo', label: 'Agencia' };
    if (isElCruce(lead)) return { cls: 'elcruce', label: 'El Cruce' };
    if (lead.channel === 'mercadopago') return { cls: 'mercadopago', label: 'Pago' };
    return { cls: 'whatsapp', label: 'Consulta' };
  }

  function originText(lead) {
    const parts = [];
    if (lead.utm_source) parts.push(lead.utm_source + (lead.utm_campaign ? ' / ' + lead.utm_campaign : ''));
    if (lead.gclid) parts.push('Google Ads');
    if (lead.fbclid) parts.push('Meta Ads');
    return parts.length ? parts.join(' · ') : '<span class="muted">Directo / orgánico</span>';
  }

  // Lista fija para el desplegable de "Excursion" al editar/agregar a mano:
  // los 25 ids de excursion.html + El Cruce + Rent a Car + Receptivo.
  // "excursion" es el texto que ya guardan los leads reales de cada canal.
  const EXCURSION_OPTIONS = [
    { id: 'la-cueva', excursion: 'La Cueva · Motos de nieve' },
    { id: 'eas', excursion: 'Clases de Ski & Snowboard' },
    { id: 'roca-negra', excursion: 'Roca Negra · Refugio' },
    { id: 'san-ramon', excursion: 'Cabalgata La Fragua' },
    { id: 'cabalgata-wesley', excursion: 'Cabalgata Wesley' },
    { id: 'neumeyer', excursion: 'Refugio Neumeyer' },
    { id: 'circuito-chico', excursion: 'Circuito Chico y Colonia Suiza' },
    { id: 'circuito-chico-campanario', excursion: 'Circuito Chico - Cerro Campanario' },
    { id: 'villa-bayo', excursion: 'Villa La Angostura y Cerro Bayo' },
    { id: 'campo-tulipanes', excursion: 'Visita al Campo de Tulipanes' },
    { id: 'san-martin', excursion: 'San Martin de los Andes - 7 Lagos' },
    { id: 'circuito-grande', excursion: 'Circuito Grande - Villa Traful' },
    { id: 'bolson-lago-puelo', excursion: 'El Bolsón y Lago Puelo' },
    { id: 'rafting-frontera', excursion: 'Rafting Frontera' },
    { id: 'rafting-villegas', excursion: 'Rafting Villegas' },
    { id: 'kayak', excursion: 'Kayak' },
    { id: 'tronador', excursion: 'Cerro Tronador y Ventisquero Negro' },
    { id: 'isla-victoria', excursion: 'Isla Victoria y Bosque de Arrayanes' },
    { id: 'puerto-blest', excursion: 'Puerto Blest y Cascada Los Cántaros' },
    { id: 'mini-cat', excursion: 'Navegación Privada · Lago Moreno' },
    { id: 'cerro-catedral', excursion: 'Cerro Catedral' },
    { id: 'beer-experience-clasico', excursion: 'Bariloche Beer Experience · Clásico' },
    { id: 'beer-experience-sunset', excursion: 'Bariloche Beer Experience · Patagonia Sunset' },
    { id: 'nieve-al-limite', excursion: 'Nieve al Límite' },
    { id: 'cerro-otto', excursion: 'Cerro Otto' },
    { id: 'elcruce', excursion: 'Traslado El Cruce · Ida' },
    { id: 'elcruce', excursion: 'Traslado El Cruce · Ida y vuelta' },
    { id: null, excursion: 'Rent a Car' },
    { id: null, excursion: 'Receptivo & Agencias' },
  ];

  const CANAL_OPTIONS = [
    { value: 'mercadopago', label: 'Pago (Mercado Pago)' },
    { value: 'whatsapp', label: 'Consulta (WhatsApp)' },
  ];

  const ORIGEN_OPTIONS = [
    { value: 'directo', label: 'Directo / orgánico' },
    { value: 'google', label: 'Google Ads' },
    { value: 'meta', label: 'Meta Ads' },
  ];
  function origenValue(lead) {
    if (lead.gclid) return 'google';
    if (lead.fbclid) return 'meta';
    return 'directo';
  }
  // Setea/limpia utm_source, utm_campaign, gclid y fbclid segun la opcion
  // elegida a mano: son los mismos campos que ya usa originText() para
  // calcular el origen automaticamente a partir de datos reales de tracking.
  function origenPatch(value) {
    const patch = { utm_source: null, utm_campaign: null, gclid: null, fbclid: null };
    if (value === 'google') patch.gclid = 'manual';
    if (value === 'meta') patch.fbclid = 'manual';
    return patch;
  }

  // Conversion entre el <input type="datetime-local"> (hora local del
  // navegador, sin zona) y el ISO con zona que guarda Supabase.
  function isoToDatetimeLocal(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function datetimeLocalToIso(val) {
    if (!val) return null;
    const d = new Date(val);
    return isNaN(d) ? null : d.toISOString();
  }

  // "Fecha paseo" es texto libre (a veces un rango, a veces el nombre de un
  // grupo en leads viejos de El Cruce); el selector de calendario solo puede
  // precargar un valor cuando el texto guardado es una fecha DD/MM/AAAA
  // simple. Al guardar siempre se escribe en ese mismo formato.
  function fechaPaseoToDateInput(txt) {
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec((txt || '').trim());
    return m ? `${m[3]}-${m[2]}-${m[1]}` : '';
  }
  function dateInputToFechaPaseo(val) {
    if (!val) return null;
    const [y, m, d] = val.split('-');
    return `${d}/${m}/${y}`;
  }

  async function apiFetch(path, options = {}) {
    const resp = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', 'x-admin-key': ADMIN_KEY, ...(options.headers || {}) },
    });
    return resp;
  }

  async function tryLogin(key) {
    ADMIN_KEY = key;
    const resp = await apiFetch('/api/admin-leads');
    if (resp.status === 401) return false;
    const data = await resp.json();
    if (!resp.ok || !data.ok) throw new Error(data.error || 'Error cargando datos');
    allLeads = data.leads || [];
    ROLE = data.role || 'admin';
    return true;
  }

  pwBtn.onclick = async () => {
    pwError.textContent = '';
    pwBtn.disabled = true;
    pwBtn.textContent = 'Entrando...';
    try {
      const ok = await tryLogin(pwInput.value);
      if (!ok) {
        pwError.textContent = 'Contraseña incorrecta.';
        ADMIN_KEY = '';
      } else {
        try {
          sessionStorage.setItem('vv-admin-key', ADMIN_KEY);
          sessionStorage.setItem('vv-admin-role', ROLE);
        } catch (e) {}
        showApp();
      }
    } catch (err) {
      pwError.textContent = 'Error: ' + (err.message || err);
    } finally {
      pwBtn.disabled = false;
      pwBtn.textContent = 'Entrar';
    }
  };
  pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') pwBtn.click(); });

  let autoRefreshStarted = false;
  function showApp() {
    gate.style.display = 'none';
    app.style.display = 'block';
    document.getElementById('role-badge').hidden = ROLE !== 'viewer';
    document.getElementById('add-lead-btn').hidden = ROLE === 'viewer';
    render();
    if (!autoRefreshStarted) {
      autoRefreshStarted = true;
      setInterval(() => { loadLeads().catch(() => {}); }, 5 * 60 * 1000);
    }
  }

  async function loadLeads() {
    const resp = await apiFetch('/api/admin-leads');
    if (resp.status === 401) {
      try { sessionStorage.removeItem('vv-admin-key'); sessionStorage.removeItem('vv-admin-role'); } catch (e) {}
      location.reload();
      return;
    }
    const data = await resp.json();
    if (!resp.ok || !data.ok) throw new Error(data.error || 'Error cargando datos');
    allLeads = data.leads || [];
    ROLE = data.role || 'admin';
    document.getElementById('role-badge').hidden = ROLE !== 'viewer';
    document.getElementById('add-lead-btn').hidden = ROLE === 'viewer';
    document.getElementById('last-update').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-AR');
    render();
  }

  function render() {
    const fromF = document.getElementById('cf-from').value;
    const toF = document.getElementById('cf-to').value;
    const channelF = document.getElementById('cf-channel').value;
    const excursionF = document.getElementById('cf-excursion').value.trim().toLowerCase();
    const fechaPaseoF = document.getElementById('cf-fechapaseo').value.trim().toLowerCase();
    const clienteF = document.getElementById('cf-cliente').value.trim().toLowerCase();
    const hotelF = document.getElementById('cf-hotel').value.trim().toLowerCase();
    const paxF = document.getElementById('cf-pax').value.trim().toLowerCase();
    const origenF = document.getElementById('cf-origen').value.trim().toLowerCase();
    const totalF = document.getElementById('cf-total').value.trim().toLowerCase();
    const statusF = document.getElementById('cf-status').value;
    const cargaF = document.getElementById('cf-carga').value;
    const notasF = document.getElementById('cf-notas').value.trim().toLowerCase();

    let leads = allLeads.filter(l => {
      if (statusF === 'abandonado' && !isAbandonedCheckout(l)) return false;
      if (statusF === 'nuevo' && (l.status !== 'nuevo' || isAbandonedCheckout(l))) return false;
      if (statusF && statusF !== 'abandonado' && statusF !== 'nuevo' && l.status !== statusF) return false;
      if (channelF === 'receptivo' && !isReceptivo(l)) return false;
      if (channelF === 'elcruce' && !isElCruce(l)) return false;
      if (channelF && channelF !== 'receptivo' && channelF !== 'elcruce' && (l.channel !== channelF || isReceptivo(l) || isElCruce(l))) return false;
      if (fromF || toF) {
        const created = l.created_at ? l.created_at.slice(0, 10) : '';
        if (!created) return false;
        if (fromF && created < fromF) return false;
        if (toF && created > toF) return false;
      }
      if (excursionF && !(l.excursion || '').toLowerCase().includes(excursionF)) return false;
      if (fechaPaseoF && !(l.fecha || '').toLowerCase().includes(fechaPaseoF)) return false;
      if (clienteF && ![l.nombre, l.dni, l.telefono, l.email].filter(Boolean).join(' ').toLowerCase().includes(clienteF)) return false;
      if (hotelF && !(l.hospedaje || '').toLowerCase().includes(hotelF)) return false;
      if (paxF && !(l.pasajeros || '').toLowerCase().includes(paxF)) return false;
      if (origenF && !originText(l).replace(/<[^>]+>/g, '').toLowerCase().includes(origenF)) return false;
      if (totalF && !String(l.total ?? '').toLowerCase().includes(totalF)) return false;
      if (cargaF) {
        const effective = l.status !== 'ganado' ? 'noconfirmado' : (l.carga_sistema || 'pendiente');
        if (effective !== cargaF) return false;
      }
      if (notasF && !(l.notes || '').toLowerCase().includes(notasF)) return false;
      return true;
    });
    filteredLeads = leads;

    const stats = document.getElementById('stats');
    const counts = { nuevo: 0, contactado: 0, cotizado: 0, recontactar: 0, pendiente_pago: 0, ganado: 0, perdido: 0 };
    let abandonados = 0;
    allLeads.forEach(l => {
      if (counts[l.status] != null) counts[l.status]++;
      if (isAbandonedCheckout(l)) abandonados++;
    });
    stats.innerHTML = `
      <div class="stat"><b>${allLeads.length}</b>Total</div>
      <div class="stat"><b>${counts.nuevo - abandonados}</b>Nuevos</div>
      <div class="stat"><b>${abandonados}</b>Carritos abandonados</div>
      <div class="stat"><b>${counts.contactado + counts.cotizado + counts.recontactar + counts.pendiente_pago}</b>En proceso</div>
      <div class="stat"><b>${counts.ganado}</b>Ganados</div>
      <div class="stat"><b>${counts.perdido}</b>Perdidos</div>
    `;

    const table = document.getElementById('table');
    const empty = document.getElementById('empty');
    const tbody = document.getElementById('tbody');

    if (!leads.length) {
      table.hidden = true;
      empty.hidden = false;
      return;
    }
    table.hidden = false;
    empty.hidden = true;

    const readOnly = ROLE === 'viewer';
    const STATUS_LABELS = { nuevo: 'Nuevo', contactado: 'Contactado', cotizado: 'Cotizado', recontactar: 'Recontactar', pendiente_pago: 'Pendiente de pago', ganado: 'Ganado', perdido: 'Perdido' };
    const CARGA_LABELS = { cargado: 'Cargado en el sistema', pendiente: 'Pendiente de carga' };

    tbody.innerHTML = leads.map(l => `
      <tr data-id="${l.id}">
        <td>
          ${readOnly ? fmtDate(l.created_at)
            : `<input type="datetime-local" class="field-input" data-field="created_at" value="${isoToDatetimeLocal(l.created_at)}">`}
        </td>
        <td>
          ${(readOnly || !isManualLead(l)) ? `<span class="badge ${channelInfo(l).cls}">${channelInfo(l).label}</span>`
            : `<select class="field-input" data-field="channel">
            ${CANAL_OPTIONS.map(o => `<option value="${o.value}" ${l.channel === o.value ? 'selected' : ''}>${o.label}</option>`).join('')}
          </select>`}
        </td>
        <td>
          ${readOnly ? (l.excursion || '-') + (l.opcion ? '<br><span class="muted">' + l.opcion + '</span>' : '')
            : `<select class="field-input" data-field="excursion_combo">
            <option value="" ${!l.excursion ? 'selected' : ''}>— Sin excursión —</option>
            ${EXCURSION_OPTIONS.map(o => `<option value="${esc(o.excursion)}" ${l.excursion === o.excursion ? 'selected' : ''}>${o.excursion}</option>`).join('')}
          </select>`}
        </td>
        <td>
          ${readOnly ? (l.fecha || '-')
            : `<input type="date" class="field-input" data-field="fecha" value="${fechaPaseoToDateInput(l.fecha)}">`}
        </td>
        <td>
          ${readOnly
            ? (l.nombre || '<span class="muted">Sin nombre</span>') + (l.dni ? '<br><span class="muted">DNI ' + l.dni + '</span>' : '') + (l.telefono ? '<br><span class="muted">' + l.telefono + '</span>' : '') + (l.email ? '<br><span class="muted">' + l.email + '</span>' : '')
            : `<input type="text" class="field-input cliente-input" data-field="nombre" value="${esc(l.nombre)}" placeholder="Nombre">
          <input type="text" class="field-input cliente-input" data-field="dni" value="${esc(l.dni)}" placeholder="DNI">
          <input type="text" class="field-input cliente-input" data-field="telefono" value="${esc(l.telefono)}" placeholder="Teléfono">
          <input type="text" class="field-input cliente-input" data-field="email" value="${esc(l.email)}" placeholder="Email">`}
        </td>
        <td>
          ${readOnly ? (l.hospedaje || '-')
            : `<input type="text" class="field-input" data-field="hospedaje" value="${esc(l.hospedaje)}" placeholder="Hotel">`}
        </td>
        <td>
          ${readOnly ? (l.pasajeros || '-')
            : `<input type="text" class="field-input" data-field="pasajeros" value="${esc(l.pasajeros)}" placeholder="Pax">`}
        </td>
        <td>
          ${readOnly ? originText(l)
            : `<select class="field-input" data-field="origen_combo">
            ${ORIGEN_OPTIONS.map(o => `<option value="${o.value}" ${origenValue(l) === o.value ? 'selected' : ''}>${o.label}</option>`).join('')}
          </select>`}
        </td>
        <td>
          ${readOnly ? fmtMoney(l.total)
            : `<input type="number" class="field-input" data-field="total" value="${l.total ?? ''}" placeholder="Total">`}
        </td>
        <td>
          ${readOnly
            ? (isAbandonedCheckout(l)
              ? `<span class="badge abandonado">Carrito abandonado</span>`
              : `<span class="badge status ${l.status}">${STATUS_LABELS[l.status] || l.status}</span>`)
            : `<select class="status ${l.status}" data-field="status">
            <option value="nuevo" ${l.status === 'nuevo' ? 'selected' : ''}>Nuevo</option>
            <option value="contactado" ${l.status === 'contactado' ? 'selected' : ''}>Contactado</option>
            <option value="cotizado" ${l.status === 'cotizado' ? 'selected' : ''}>Cotizado</option>
            <option value="recontactar" ${l.status === 'recontactar' ? 'selected' : ''}>Recontactar</option>
            <option value="pendiente_pago" ${l.status === 'pendiente_pago' ? 'selected' : ''}>Pendiente de pago</option>
            <option value="ganado" ${l.status === 'ganado' ? 'selected' : ''}>Ganado</option>
            <option value="perdido" ${l.status === 'perdido' ? 'selected' : ''}>Perdido</option>
          </select>${isAbandonedCheckout(l) ? '<span class="abandonado-hint">⚠ Carrito abandonado</span>' : ''}`}
        </td>
        <td>
          ${l.status !== 'ganado'
            ? `<span class="badge carga noconfirmado">No confirmado</span>`
            : (readOnly
              ? `<span class="badge carga ${l.carga_sistema || 'pendiente'}">${CARGA_LABELS[l.carga_sistema || 'pendiente']}</span>`
              : `<select class="carga ${l.carga_sistema || 'pendiente'}" data-field="carga_sistema">
              <option value="pendiente" ${(l.carga_sistema || 'pendiente') === 'pendiente' ? 'selected' : ''}>Pendiente de carga</option>
              <option value="cargado" ${l.carga_sistema === 'cargado' ? 'selected' : ''}>Cargado en el sistema</option>
            </select>`)}
        </td>
        <td>
          ${readOnly
            ? (l.notes ? l.notes : '<span class="muted">-</span>')
            : `<input type="text" class="notes-input" data-field="notes" value="${(l.notes || '').replace(/"/g, '&quot;')}" placeholder="Notas...">
          <span class="save-hint"></span>`}
        </td>
        <td>
          ${(!readOnly && isManualLead(l)) ? `<button type="button" class="delete-btn" title="Eliminar">🗑</button>` : ''}
        </td>
      </tr>
    `).join('');

    if (!readOnly) {
      tbody.querySelectorAll('select.status').forEach(sel => {
        sel.addEventListener('change', () => saveField(sel));
      });
      tbody.querySelectorAll('select.carga').forEach(sel => {
        sel.addEventListener('change', () => saveField(sel));
      });
      tbody.querySelectorAll('.notes-input').forEach(inp => {
        inp.addEventListener('change', () => saveField(inp));
      });
      tbody.querySelectorAll('.field-input').forEach(el => {
        el.addEventListener('change', () => saveField(el));
      });
      tbody.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => deleteLead(btn));
      });
    }

    if (!colsInitialized) {
      colsInitialized = true;
      initColWidths();
      initColResize();
    }
  }

  async function deleteLead(btn) {
    const tr = btn.closest('tr');
    const id = tr.dataset.id;
    const lead = allLeads.find(l => String(l.id) === String(id));
    const nombre = lead && lead.nombre ? lead.nombre : `lead #${id}`;
    if (!confirm(`¿Eliminar definitivamente a ${nombre}? Esta acción no se puede deshacer.`)) return;

    btn.disabled = true;
    try {
      const resp = await apiFetch('/api/admin-delete-lead', {
        method: 'POST',
        body: JSON.stringify({ id }),
      });
      const data = await resp.json();
      if (!resp.ok || !data.ok) throw new Error(data.error || 'Error');
      allLeads = allLeads.filter(l => String(l.id) !== String(id));
      render();
    } catch (err) {
      alert('No se pudo eliminar: ' + (err.message || err));
      btn.disabled = false;
    }
  }

  async function saveField(el) {
    const tr = el.closest('tr');
    const id = tr.dataset.id;
    const field = el.dataset.field;
    const value = el.value;
    const hint = tr.querySelector('.save-hint');
    const lead = allLeads.find(l => String(l.id) === String(id));

    let patch;
    let needsRerender = false;

    if (field === 'status') {
      el.className = 'status ' + value;
      if (lead) lead.status = value;
      patch = { status: value };
      needsRerender = true;
    } else if (field === 'carga_sistema') {
      el.className = 'carga ' + value;
      if (lead) lead.carga_sistema = value;
      patch = { carga_sistema: value };
      needsRerender = true;
    } else if (field === 'created_at') {
      const iso = datetimeLocalToIso(value);
      if (lead) lead.created_at = iso;
      patch = { created_at: iso };
    } else if (field === 'fecha') {
      const txt = dateInputToFechaPaseo(value);
      if (lead) lead.fecha = txt;
      patch = { fecha: txt };
    } else if (field === 'excursion_combo') {
      const opt = EXCURSION_OPTIONS.find(o => o.excursion === value);
      const excursion = opt ? opt.excursion : null;
      const excursion_id = opt ? opt.id : null;
      if (lead) { lead.excursion = excursion; lead.excursion_id = excursion_id; }
      patch = { excursion, excursion_id };
      needsRerender = true;
    } else if (field === 'origen_combo') {
      patch = origenPatch(value);
      if (lead) Object.assign(lead, patch);
      needsRerender = true;
    } else if (field === 'total') {
      const n = value === '' ? null : Number(value);
      if (lead) lead.total = n;
      patch = { total: n };
    } else {
      // channel, nombre, dni, telefono, email, hospedaje, pasajeros, notes
      if (lead) lead[field] = value;
      patch = { [field]: value };
    }

    try {
      const resp = await apiFetch('/api/admin-update-lead', {
        method: 'POST',
        body: JSON.stringify({ id, ...patch }),
      });
      const data = await resp.json();
      if (!resp.ok || !data.ok) throw new Error(data.error || 'Error');
      if (hint) { hint.textContent = '✓'; setTimeout(() => { hint.textContent = ''; }, 1500); }
      if (needsRerender) render();
    } catch (err) {
      if (hint) hint.textContent = '✗ ' + (err.message || err);
    }
  }

  function csvCell(v) {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function exportCsv() {
    const STATUS_LABELS = { nuevo: 'Nuevo', contactado: 'Contactado', cotizado: 'Cotizado', recontactar: 'Recontactar', pendiente_pago: 'Pendiente de pago', ganado: 'Ganado', perdido: 'Perdido' };
    const CARGA_LABELS = { cargado: 'Cargado en el sistema', pendiente: 'Pendiente de carga' };
    const headers = ['Fecha', 'Canal', 'Excursión', 'Opción', 'Fecha del paseo', 'Cliente', 'DNI', 'Teléfono', 'Email', 'Hospedaje', 'Pasajeros', 'Total', 'Estado', 'Carga sistema', 'Origen', 'Notas'];
    const rows = filteredLeads.map(l => [
      l.created_at ? new Date(l.created_at).toLocaleString('es-AR') : '',
      channelInfo(l).label,
      l.excursion || '',
      l.opcion || '',
      l.fecha || '',
      l.nombre || '',
      l.dni || '',
      l.telefono || '',
      l.email || '',
      l.hospedaje || '',
      l.pasajeros || '',
      l.total || '',
      isAbandonedCheckout(l) ? 'Carrito abandonado' : (STATUS_LABELS[l.status] || l.status || ''),
      l.status !== 'ganado' ? 'No confirmado' : CARGA_LABELS[l.carga_sistema || 'pendiente'],
      originText(l).replace(/<[^>]+>/g, ''),
      l.notes || '',
    ]);
    const csv = '﻿' + [headers, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `vivir-viajes-reservas-${stamp}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  document.getElementById('export-btn').addEventListener('click', exportCsv);

  const COLUMN_FILTER_IDS = [
    'cf-from', 'cf-to', 'cf-channel', 'cf-excursion', 'cf-fechapaseo', 'cf-cliente',
    'cf-hotel', 'cf-pax', 'cf-origen', 'cf-total', 'cf-status', 'cf-carga', 'cf-notas',
  ];
  COLUMN_FILTER_IDS.forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener(el.tagName === 'SELECT' || el.type === 'date' ? 'change' : 'input', render);
  });
  document.getElementById('f-clear-all').addEventListener('click', () => {
    COLUMN_FILTER_IDS.forEach(id => { document.getElementById(id).value = ''; });
    render();
  });
  document.getElementById('refresh-btn').addEventListener('click', loadLeads);
  document.getElementById('add-lead-btn').addEventListener('click', async () => {
    const btn = document.getElementById('add-lead-btn');
    btn.disabled = true;
    try {
      const resp = await apiFetch('/api/admin-create-lead', { method: 'POST' });
      const data = await resp.json();
      if (!resp.ok || !data.ok) throw new Error(data.error || 'Error');
      allLeads.unshift(data.lead);
      render();
    } catch (err) {
      alert('No se pudo agregar la fila: ' + (err.message || err));
    } finally {
      btn.disabled = false;
    }
  });

  (async function init() {
    if (ADMIN_KEY) {
      try {
        const ok = await tryLogin(ADMIN_KEY);
        if (ok) { showApp(); return; }
      } catch (e) {}
      try { sessionStorage.removeItem('vv-admin-key'); } catch (e) {}
      ADMIN_KEY = '';
    }
  })();
</script>
</body>
</html>
